<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Private AI for law, medical and finance firms. Your own assistant, trained on your files, running in your office — never the cloud. Every answer proves your data never left.">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<meta property="og:title" content="Kwizerana — All the power of AI. None of the exposure.">
<meta property="og:description" content="Private AI that lives in your office and proves your clients' data never left the building.">
<meta property="og:image" content="https://kwizeranafinance-kind.github.io/kwizerana-local-ai/assets/img/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>Kwizerana — Is your firm a fit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Figtree:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAFE; --paper:#F1EEFA; --paper-2:#E9E3F6;
    --ink:#241634; --ink-soft:#2A1840; --navy:#190B24; --taupe:#CAC4EA;
    --acc:#652D90; --acc-deep:#190B24; --acc-soft:#7E44AE; --acc-rose:#CAC4EA;
    --verify:#DD7045; --verify-soft:#E58B66;
    --muted:#6E6484; --faint:#9A93AE;
    --line:#E7E1F2; --line-2:#DAD2EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:30px 18px;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(760px 520px at 84% -8%, rgba(101,45,144,0.06), transparent 60%),
               radial-gradient(560px 420px at 4% 8%, rgba(184,155,130,0.10), transparent 55%);}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:500;letter-spacing:-0.014em;line-height:1.1;margin:0;}

  .card{position:relative;z-index:1;width:100%;max-width:620px;background:#FFFFFF;border:1px solid var(--line-2);border-radius:22px;
    box-shadow:0 34px 80px -42px rgba(70,45,40,0.55);overflow:hidden;}

  /* top bar */
  .top{padding:20px 28px 0;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:700;letter-spacing:0.06em;font-size:14px;color:var(--ink);}
  .brand span{color:var(--acc);}
  .privacy{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--verify);display:flex;align-items:center;gap:6px;}

  .progress{height:3px;background:var(--paper-2);margin:18px 28px 0;border-radius:3px;overflow:hidden;}
  .progress .fill{height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .4s ease;}

  .stage{padding:34px 32px 36px;}
  @media(max-width:520px){.stage{padding:28px 22px 30px;}}

  .step{animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .kicker{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--acc-soft);}
  .qh{font-size:clamp(22px,4vw,29px);margin-top:14px;color:var(--ink);}
  .qhelp{font-size:14.5px;color:var(--muted);margin-top:10px;}

  .options{margin-top:24px;display:flex;flex-direction:column;gap:11px;}
  .opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:16px 18px;cursor:pointer;transition:.18s;display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;font-family:inherit;}
  .opt:hover{border-color:var(--acc);background:#fff;transform:translateX(3px);box-shadow:0 10px 26px -20px rgba(94,35,48,0.5);}
  .opt .t{display:block;font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;color:var(--ink);}
  .opt .s{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;}
  .opt .arrow{color:var(--acc);font-family:'JetBrains Mono',monospace;opacity:0;transform:translateX(-6px);transition:.18s;flex-shrink:0;}
  .opt:hover .arrow{opacity:1;transform:none;}

  .back{margin-top:22px;background:none;border:none;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;cursor:pointer;padding:6px 0;text-transform:uppercase;}
  .back:hover{color:var(--acc);}
  .back.hide{visibility:hidden;}

  /* intro */
  .intro{text-align:center;padding:8px 6px;}
  .intro .seal-sm{width:88px;height:88px;border-radius:50%;margin:6px auto 22px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc);
    border:2px solid var(--acc-soft);background:radial-gradient(circle at 50% 36%,#EFEBF9,#E1D9F3 72%);box-shadow:inset 0 2px 9px rgba(101,45,144,0.16);}
  .intro .seal-sm::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid var(--acc);opacity:0.4;}
  .intro .seal-sm .c{font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;color:var(--acc-deep);}
  .intro h1{font-size:clamp(26px,4.6vw,36px);}
  .intro h1 em{font-style:normal;color:var(--acc);}
  .intro p{font-size:16px;color:var(--muted);max-width:30em;margin:16px auto 0;}
  .intro .meta{margin-top:22px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:var(--faint);text-transform:uppercase;}
  .intro .meta b{color:var(--verify);}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:15px 30px;border-radius:11px;font-weight:600;font-size:15.5px;cursor:pointer;border:none;font-family:inherit;transition:.2s;text-decoration:none;}
  .btn-primary{background:var(--acc);color:#FBF1F0;}
  .btn-primary:hover{background:var(--acc-deep);}
  .intro .start{margin-top:28px;}

  /* contact form */
  .form{margin-top:24px;display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-family:inherit;font-size:15px;color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--acc);}
  .form .btn-primary{margin-top:6px;align-self:flex-start;}
  .form .err{color:var(--acc);font-size:12.5px;display:none;}

  /* result */
  .result{text-align:center;}
  .result .seal{width:128px;height:128px;border-radius:50%;margin:0 auto 22px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc);
    border:2px solid var(--acc-soft);background:radial-gradient(circle at 50% 36%,#EFEBF9,#E1D9F3 72%,#D6CBEE);box-shadow:inset 0 2px 10px rgba(101,45,144,0.18),0 12px 30px -18px rgba(94,35,48,0.6);}
  .result .seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid var(--acc);opacity:0.4;}
  .result .seal .top{position:absolute;top:18px;font-family:'JetBrains Mono',monospace;font-size:6.5px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.75;}
  .result .seal .c{font-family:'Poppins',sans-serif;font-size:21px;font-weight:600;color:var(--acc-deep);}
  .result .seal .tick{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:7.5px;color:var(--verify);}
  .result .seal .bot{position:absolute;bottom:18px;font-family:'JetBrains Mono',monospace;font-size:6px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.55;}
  .result .vk{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--verify);}
  .result.soft .vk{color:var(--taupe);}
  .result h2{font-size:clamp(25px,4.4vw,34px);margin-top:12px;}
  .result h2 em{font-style:normal;color:var(--acc);}
  .result .summary{font-size:16px;color:var(--ink-soft);max-width:34em;margin:18px auto 0;line-height:1.6;}
  .result .summary b{color:var(--acc-deep);}
  .result .cta{margin-top:28px;}
  .result .sub-cta{margin-top:14px;font-size:13px;color:var(--muted);}
  .result .restart{margin-top:24px;background:none;border:none;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;cursor:pointer;text-transform:uppercase;}
  .result .restart:hover{color:var(--acc);}
  .result.soft .seal{border-color:var(--line-2);background:radial-gradient(circle at 50% 36%,#F3F0FA,#E7E1F4);}
  .result.soft .seal .c{color:var(--taupe);}
  .result.soft .seal .tick{color:var(--taupe);}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="brand">KWIZERANA<span> · </span>SOVEREIGN</span>
      <span class="privacy" id="privacyTag">✓ Private — answers not stored</span>
    </div>
    <div class="progress"><div class="fill" id="fill"></div></div>
    <div class="stage" id="stage"></div>
  </div>

<script>
(function(){
  const stage=document.getElementById('stage');
  const fill=document.getElementById('fill');
  const privacyTag=document.getElementById('privacyTag');

  const Q=[
    {id:'firm', kicker:'About your firm', q:"First — what kind of firm are you?", help:"So we can speak to your world.", opts:[
      {v:'law', t:'Law firm', s:'Privileged client files, contracts, matters'},
      {v:'medical', t:'Medical or dental practice', s:'Patient records under HIPAA'},
      {v:'finance', t:'Accounting or financial advisory', s:'Client financials and filings'},
      {v:'other_reg', t:'Another firm with sensitive data', s:'NDAs, confidential client information'},
      {v:'exploring', t:'Just exploring for now', s:"Curious what this is"}
    ]},
    {id:'mandate', kicker:'The big one', q:"How sensitive is the data you'd want AI to help with?", help:"This matters more than anything else.", opts:[
      {v:'hard', t:"It legally can't go to a third party", s:'Privileged, protected, or regulated'},
      {v:'strong', t:"We'd strongly prefer it never leaves", s:'Confidential — leadership wants it in-house'},
      {v:'nice', t:"Sensitive, but we're somewhat flexible", s:"We'd like privacy; it's not a hard rule"},
      {v:'none', t:'Nothing especially sensitive', s:'General business use'}
    ]},
    {id:'use', kicker:'What you need', q:"What would you most want it to do?", help:"Pick the one that matters most.", opts:[
      {v:'ask', t:'Answer questions across our files', s:'"What did we agree on in the Acme contract?"'},
      {v:'draft', t:'Draft & review documents', s:'Letters, contracts, intake forms'},
      {v:'summarize', t:'Summarize the long stuff', s:'Depositions, agreements, recorded calls'},
      {v:'all', t:'Honestly, all of it', s:'A real assistant for the whole firm'}
    ]},
    {id:'usage', kicker:'How much', q:"How much would your team lean on it?", help:"A rough sense is fine.", opts:[
      {v:'heavy', t:'Daily, across the team', s:'It would be part of how we work'},
      {v:'moderate', t:'Regularly, a few of us', s:'Steady, meaningful use'},
      {v:'light', t:'Here and there', s:'The occasional question'},
      {v:'unsure', t:'Not sure yet', s:'Still figuring it out'}
    ]},
    {id:'timeline', kicker:'Timing', q:"When would you want it running?", help:"No wrong answer.", opts:[
      {v:'asap', t:'As soon as possible', s:"There's a real need right now"},
      {v:'months', t:'In the next few months', s:'Planning ahead'},
      {v:'year', t:'Sometime this year', s:"It's on the radar"},
      {v:'explore', t:'Just exploring', s:'Gathering information'}
    ]}
  ];

  const state={answers:{}, idx:-1, name:'', firmName:'', email:''};
  // idx: -1 intro, 0..Q.length-1 questions, Q.length contact, Q.length+1 result
  const CONTACT=Q.length, RESULT=Q.length+1;

  const firmLabel={law:'law firm',medical:'practice',finance:'firm',other_reg:'firm',exploring:'firm'};
  const useLabel={
    ask:'answering questions across your files',
    draft:'drafting and reviewing documents',
    summarize:'summarizing long files, calls, and depositions',
    all:'handling everyday document work end to end'
  };

  function setProgress(){
    let pct=0;
    if(state.idx<0) pct=0;
    else if(state.idx<CONTACT) pct=((state.idx)/(CONTACT+1))*100;
    else if(state.idx===CONTACT) pct=(CONTACT/(CONTACT+1))*100;
    else pct=100;
    fill.style.width=pct+'%';
  }

  function render(){
    setProgress();
    privacyTag.style.visibility = (state.idx===RESULT)?'hidden':'visible';
    if(state.idx===-1) return renderIntro();
    if(state.idx<CONTACT) return renderQuestion(Q[state.idx]);
    if(state.idx===CONTACT) return renderContact();
    return renderResult();
  }

  function renderIntro(){
    stage.innerHTML=`
      <div class="step intro">
        <div class="seal-sm"><span class="c">Fit</span></div>
        <h1>Is a private Enclave right for <em>your firm?</em></h1>
        <p>Five quick questions. We'll give you an honest read on whether a sealed, in-house AI is worth it for you — and tell you plainly if it isn't.</p>
        <div class="meta"><span><b>~60</b> seconds</span><span><b>No</b> sales pitch</span><span><b>Private</b> by design</span></div>
        <div class="start"><button class="btn btn-primary" id="go">Find out →</button></div>
      </div>`;
    document.getElementById('go').onclick=()=>{state.idx=0;render();};
  }

  function renderQuestion(item){
    stage.innerHTML=`
      <div class="step">
        <div class="kicker">${item.kicker} · ${state.idx+1} of ${Q.length}</div>
        <h2 class="qh">${item.q}</h2>
        <p class="qhelp">${item.help}</p>
        <div class="options">
          ${item.opts.map(o=>`<button class="opt" data-v="${o.v}"><span><span class="t">${o.t}</span><span class="s">${o.s}</span></span><span class="arrow">→</span></button>`).join('')}
        </div>
        <button class="back ${state.idx===0?'hide':''}" id="back">← Back</button>
      </div>`;
    stage.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{state.answers[item.id]=b.dataset.v;state.idx++;render();};
    });
    const back=document.getElementById('back');
    if(back) back.onclick=()=>{state.idx--;render();};
  }

  function renderContact(){
    stage.innerHTML=`
      <div class="step">
        <div class="kicker">Almost there</div>
        <h2 class="qh">Where should we send your result?</h2>
        <p class="qhelp">So your read — and a tailored first step — reaches the right inbox. We don't add you to any list.</p>
        <div class="form">
          <div class="field"><label>Your name</label><input id="f_name" type="text" placeholder="Jane Cole" autocomplete="name"></div>
          <div class="field"><label>Firm</label><input id="f_firm" type="text" placeholder="Cole &amp; Associates" autocomplete="organization"></div>
          <div class="field"><label>Work email</label><input id="f_email" type="email" placeholder="jane@colelaw.com" autocomplete="email"></div>
          <div class="err" id="err">A work email helps us send your result.</div>
          <button class="btn btn-primary" id="see">See my result →</button>
        </div>
        <button class="back" id="back">← Back</button>
      </div>`;
    document.getElementById('see').onclick=()=>{
      const email=document.getElementById('f_email').value.trim();
      if(!email || email.indexOf('@')<1){document.getElementById('err').style.display='block';return;}
      state.name=document.getElementById('f_name').value.trim();
      state.firmName=document.getElementById('f_firm').value.trim();
      state.email=email;
      state.idx=RESULT;render();
    };
    document.getElementById('back').onclick=()=>{state.idx--;render();};
  }

  function verdict(){
    const a=state.answers;
    const reg=['law','medical','finance','other_reg'].includes(a.firm);
    if(a.mandate==='none') return 'soft';
    if((a.mandate==='hard'||a.mandate==='strong') && reg) return 'strong';
    if(a.mandate==='hard'||a.mandate==='strong') return 'likely';
    if(a.mandate==='nice') return 'likely';
    return 'soft';
  }

  function renderResult(){
    const a=state.answers;
    const v=verdict();
    const first=state.name?state.name.split(' ')[0]:'';
    const greeting=first?`${first}, `:'';
    const fl=firmLabel[a.firm]||'firm';
    const ul=useLabel[a.use]||'your everyday document work';

    let cls,vk,h,summary,cta,sub;
    if(v==='strong'){
      cls='strong'; vk='✓ Strong fit';
      h=`${greeting}you're exactly who we built this <em>for.</em>`;
      summary=`Here's what we'd set up: a private Enclave for your ${fl}, focused on <b>${ul}</b> — running entirely on a box in your office, with a receipt proving your client data <b>never left the building.</b>`;
      cta='Request a private briefing →';
      sub='A short, no-pressure visit. We bring the box and show you a live receipt.';
    } else if(v==='likely'){
      cls='likely'; vk='✓ Looks like a fit';
      h=`${greeting}this looks worth a <em>conversation.</em>`;
      summary=`Based on your answers, a private Enclave focused on <b>${ul}</b> could be a strong fit. The quickest way to know for sure is a short briefing — we'll give you a straight read, no pressure.`;
      cta='Request a private briefing →';
      sub='Fifteen minutes. If it isn\'t right for you, we\'ll say so.';
    } else {
      cls='soft'; vk='— An honest read';
      h=`${greeting}you might not need the <em>full setup</em> yet.`;
      summary=`We'd rather tell you that than sell you something. A private Enclave really earns its place when you're handling data that <b>can't touch the cloud.</b> If that changes — or you'd like to talk it through anyway — we're glad to.`;
      cta='I\'d still like to talk →';
      sub='No pitch. Just a conversation when the timing\'s right.';
    }

    stage.innerHTML=`
      <div class="step result ${cls}">
        <div class="seal"><span class="top">Membrane</span><span class="c">${v==='soft'?'Noted':'Sealed'}</span><span class="tick">${v==='soft'?'· honest read ·':'✓ a fit'}</span><span class="bot">Kwizerana</span></div>
        <div class="vk">${vk}</div>
        <h2>${h}</h2>
        <p class="summary">${summary}</p>
        <div class="cta"><a href="https://calendly.com/kwizerana/private-briefing" class="btn btn-primary" id="book">${cta}</a></div>
        <div class="sub-cta">${sub}</div>
        <button class="restart" id="restart">↺ Start over</button>
      </div>`;
    document.getElementById('restart').onclick=()=>{state.answers={};state.name=state.firmName=state.email='';state.idx=-1;render();};
  }

  render();
})();
</script>
</body>
</html>
